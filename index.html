<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#14141f">
<title>Voice Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Voice Studio</h1>
<p class="hint">Use earbuds so playback stays out of the mic.</p>

<div class="panel">
  <label>Microphone
    <select id="micSelect"></select>
  </label>
  <button id="micRefresh">Refresh mic list</button>
  <label>Playback through
    <select id="outSelect">
      <option value="default">Default (earbuds if connected)</option>
    </select>
  </label>
  <p class="hint">Tip: pick your earbuds in the mic list to use their mic. Bluetooth mics can sound thin, so record a short test and compare.</p>
</div>

<div id="tracks"></div>

<div class="panel">
  <label>Sync offset: <span id="offsetLabel">0</span> ms
    <input type="range" id="offset" min="0" max="400" value="0">
  </label>
  <button id="mixBtn" class="primary">Mix and download</button>
  <a id="download" style="display:none">Download mix</a>
</div>

<p id="status"></p>

<div class="bottombar">
  <div class="player">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="curTime">0:00.0</span><span id="durTime">0:00.0</span></div>
    <div class="row">
      <button id="playPause">Play</button>
      <button id="stopAll">Stop</button>
    </div>
  </div>
  <div class="row">
    <button id="saveBtn" class="primary">Save this song</button>
    <button id="newBtn">Start new song</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
